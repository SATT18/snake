# Сборки для Windows и macOS: запускается при публикации релиза на GitHub
# и прикладывает установщики к этому релизу.
name: Build desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить сборки"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: release/Snake-*.exe
          - os: macos-latest
            target: --mac
            files: release/Snake-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Сертификатов подписи нет — собираем неподписанные приложения
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
