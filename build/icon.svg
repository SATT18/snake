<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset="1" stop-color="#2a7de0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be65f"/>
      <stop offset="1" stop-color="#32a84c"/>
    </linearGradient>
    <radialGradient id="head" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8ef07a"/>
      <stop offset="1" stop-color="#2fae45"/>
    </radialGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.45" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#e08a00"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sky)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Травяной остров -->
  <ellipse cx="128" cy="200" rx="96" ry="28" fill="#2f8f3a"/>
  <ellipse cx="128" cy="194" rx="96" ry="26" fill="#5cb338"/>

  <!-- Тело: обводка и заливка -->
  <path d="M52 190 C 52 158, 104 156, 128 166 S 202 178, 202 140 S 160 104, 132 112"
        fill="none" stroke="#1f6e33" stroke-width="42" stroke-linecap="round"/>
  <path d="M52 190 C 52 158, 104 156, 128 166 S 202 178, 202 140 S 160 104, 132 112"
        fill="none" stroke="url(#body)" stroke-width="32" stroke-linecap="round"/>

  <!-- Голова -->
  <circle cx="118" cy="98" r="40" fill="#1f6e33"/>
  <circle cx="118" cy="98" r="35" fill="url(#head)"/>

  <!-- Глаза -->
  <circle cx="102" cy="88" r="14" fill="#ffffff"/>
  <circle cx="134" cy="86" r="14" fill="#ffffff"/>
  <circle cx="105" cy="90" r="7" fill="#0b1020"/>
  <circle cx="137" cy="88" r="7" fill="#0b1020"/>
  <circle cx="102" cy="86" r="2.5" fill="#ffffff"/>
  <circle cx="134" cy="84" r="2.5" fill="#ffffff"/>

  <!-- Монета -->
  <circle cx="196" cy="60" r="26" fill="url(#coin)" stroke="#f5a300" stroke-width="5"/>
  <circle cx="196" cy="60" r="14" fill="none" stroke="#e08a00" stroke-opacity="0.55" stroke-width="3"/>
</svg>
