<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud">
      <div class="pill"><span class="coin"></span><b id="score">0</b></div>
      <div class="pill"><span class="label">Рекорд</span><b id="best">0</b></div>
    </div>

    <div id="overlay">
      <div class="card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
      </div>
    </div>

    <footer>← → / A D — повернуть · ↑ / W — старт · Пробел — пауза · Enter — заново</footer>

    <script src="app.js"></script>
  </body>
</html>
